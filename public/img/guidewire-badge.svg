<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Guidewire Official Brand Color Badge -->
  <defs>
    <linearGradient id="gwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d739d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a5578;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circular badge -->
  <circle cx="50" cy="50" r="48" fill="url(#gwGradient)" stroke="#ffffff" stroke-width="2"/>
  <!-- GW Text -->
  <text x="50" y="45" font-size="26" font-weight="bold" fill="white" font-family="Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">GW</text>
  <!-- Badge accent line -->
  <circle cx="50" cy="65" r="2" fill="white"/>
  <circle cx="45" cy="70" r="1.5" fill="white"/>
  <circle cx="55" cy="70" r="1.5" fill="white"/>
</svg>